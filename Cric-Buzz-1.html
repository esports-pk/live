        body { margin: 0; padding-top: 5px; font-family: Arial, sans-serif; background: #000; color: white; }
        #jwplayerDiv { width: 100%; height: 100%; position: relative; }
        .announcement-bar { color: #fff; padding: 10px 0; overflow: hidden; white-space: nowrap; background: #111; }
        .marquee { display: inline-block; animation: marquee 65s linear infinite; padding-left: 100%; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .sticky { position: fixed; top: 0; width: 100%; z-index: 1000; }
    </style>
</head>

</div>

<div id="myHeader">
    <div id="jwplayerDiv"></div>
</div>

<script type="text/javascript">
    // Encryption Logic
    var _0xeb1 = {
        // StarzPlay MPD Link (Encoded)
        h: "aHR0cHM6Ly9ldi1mYXN0LW1wZC5zdGFyenBsYXlhcmFiaWEuY29tL2xpdmUvZWRzL0NyaWNMaWZlMi9EQVNIL0NyaWNMaWZlMi5tcGQ=",
        // Key ID
        ki: "NDhiZWY4M2I0YzZhM2M1MTg5YjAxYjAxMjYyMTBkYTQ=",
        // Key
        k: "YmQwODUyMzBiN2IwOWU1MDk1NGZlMGFmMTExYThhOWY="
    };

    function _decrypt(input) {
        return atob(input);
    }

    var player = jwplayer("jwplayerDiv").setup({
        file: _decrypt(_0xeb1.h),
        type: "dash",
        drm: {
            clearkey: {
                keyId: _decrypt(_0xeb1.ki),
                key: _decrypt(_0xeb1.k)
            }
        },
        autostart: true,
        mute: true,
        image: "WhatsApp Image 2025-02-22 at 5.19.53 PM.jpeg",
        width: "100%",
        aspectratio: "16:9"
    });

    player.on('play', function () {
        player.setMute(false);
    });

    // Sticky Header Logic
    window.onscroll = function() {
        var header = document.getElementById("myHeader");
        var sticky = header.offsetTop;
        if (window.pageYOffset >= sticky) {
            header.classList.add("sticky");
        } else {
            header.classList.remove("sticky");
        }
    };

    // Anti-Theft Logic
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode === 123 || (e.ctrlKey && (e.key === 'u' || e.key === 'i'))) e.preventDefault();
    });

    // Anti-Embed Logic
    const allowedParent = "https://esportspk.site";
    if (window !== window.top && !document.referrer.startsWith(allowedParent)) {
        document.body.innerHTML = "<h1>Embedding not allowed</h1>";
    }
</script>
